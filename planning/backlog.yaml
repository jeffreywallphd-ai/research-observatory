plan:
  id: RO-IMPLEMENTATION-PLAN-001
  title: Research Observatory Capability -> Slice -> Task Execution Plan
  version: '1.3'
  date: '2026-08-07'
  source:
    document: Research_Observatory_Systems_Design.docx
    version: Architecture Baseline 1.3
    relationship: This backlog operationalizes the source architecture; it does not replace architecture decisions.
  authority: This YAML file is the authoritative task, dependency, gate, and progress ledger. Rendered DOCX and Markdown plans
    are generated explanatory views.
  primary_delivery_priority: Complete and release the Windows PC/lab edition first; then qualify the same desktop and local
    project format on macOS and Linux (including Linux ARM64/NVIDIA DGX Spark-class lab systems) before research-production,
    university-hosted, and managed-cloud delivery.
  task_id_policy: IDs are permanent. Never renumber or reuse an ID after publication.
  relationship: This backlog operationalizes the architecture baseline and accepted ADRs; it cannot change product intent
    or architecture by itself.
  document_set:
    vision: AI_Research_Development_Platform_Vision_v1.3.docx
    architecture: Research_Observatory_Systems_Design_v1.3.docx
    automation_profile: Research_Observatory_Project_Automation_Guide_v1.3.md
    document_use_guide: Research_Observatory_Document_Governance_and_Repo_Setup_Guide_v1.3.md
    approved_ui_reference: design/ui-reference/REFERENCE_MANIFEST.yaml
    workflow_catalog: design/ui-reference/WORKFLOW_CATALOG.json
status_definitions:
  NOT_STARTED: Dependencies or release conditions are not yet satisfied.
  READY: All dependencies are DONE, the wave activation gate is approved, and the task may be claimed.
  IN_PROGRESS: The task is claimed and is being implemented or verified; owner, branch, base SHA, worktree, and lease identify
    the active agent.
  BLOCKED: Work cannot proceed; blocker and next action are recorded.
  REVIEW: Implementation and required verification are complete; criterion-linked evidence awaits independent review.
  DONE: Acceptance criteria and verification evidence have been independently confirmed.
  DEFERRED: Intentionally held outside the active local-first release sequence.
  CANCELLED: Intentionally abandoned or superseded; rationale and replacement task or decision are recorded.
priority_definitions:
  P0: Required for the complete PC/lab release or its safe engineering foundation.
  P1: High-value local research capability scheduled after the core local release unless explicitly pulled forward.
  P2: University-hosted delivery and institution-scale operation.
  P3: Managed cloud delivery, multi-tenancy, and commercial-scale operation.
deployment_profiles:
  LOC: Individual local desktop project home; Windows is qualified first, with macOS and Linux activated after G6.
  LAB: Laboratory-managed desktop/workstation using the complete local edition on an approved Windows, macOS, or Linux profile.
  UNI: University-hosted services accessed by the canonical desktop UI
  CLD: Managed cloud services accessed by the canonical desktop UI
  ALL: Contract or capability shared by all deployment profiles
estimate_scale:
  S: Small, normally one focused coding session or one narrowly bounded change set.
  M: Medium, normally several cohesive changes with unit/contract tests.
  L: Large, still one reviewable slice task but likely requiring multiple implementation iterations and dedicated integration
    tests.
