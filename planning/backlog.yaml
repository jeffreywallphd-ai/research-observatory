- id: CAP-10
  alias: CAP-novelty-opportunities
  title: Novelty auditing, research opportunities, and plural research modes
  objective: Move from evidence mapping to defensible opportunity dossiers through nearest-prior comparison, independent challenge,
    plural gap logic, critical problematization, and living research memory.
  exit_criteria:
  - The local MVP decomposes an idea, retrieves nearest prior work, compares facets, and produces bounded novelty language
    with human approval.
  - Critical and hermeneutic workflows preserve alternative readings, researcher memos, explicit assumptions, and interpretive
    authority before theory/critical article production.
  - Advanced detectors produce typed candidates with false-positive warnings rather than a universal gap score.
  - Accepted opportunities can hand off explicitly to empirical study design or empirical/theory/critical manuscript-development
    workflows.
  - Living-monitor changes can identify affected claims, designs, manuscripts, reviews, and opportunity assessments.
