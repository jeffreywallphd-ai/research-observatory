status_profile:
  name: research-observatory-lightweight
  relationship_to_general_standard: CLAIMED is represented by IN_PROGRESS plus task lease metadata. A durable Wave campaign
    owns the execution context; capabilities contribute outcomes; slices are ordered independent-review checkpoints; tasks
    remain the atomic evidence units.
  claim_transition: READY -> IN_PROGRESS
  submit_transition: IN_PROGRESS -> REVIEW
  review_transitions:
  - REVIEW -> DONE
  - REVIEW -> IN_PROGRESS
  - REVIEW -> BLOCKED
  default_execution_unit: wave-campaign
  integration_unit: slice
  atomic_evidence_unit: task
desktop_platforms:
  windows-x64: Windows 11 x64; primary W0-W5 implementation and release-authoritative target.
  macos-arm64: Apple Silicon macOS; activated and release-qualified in W6.
  linux-x64: Ubuntu-compatible x86_64 Linux desktop/workstation; activated and release-qualified in W6.
  linux-arm64: Ubuntu-compatible ARM64 Linux desktop/workstation, including NVIDIA DGX Spark-class systems; activated and
    release-qualified in W6.
  platform-neutral: Domain, data, workflow, and UI contracts intended to behave identically on all qualified desktop platforms.
verification_profiles:
  foundation: Repository, generated-state, backlog/campaign, architecture, formatting, and supply-chain checks.
  architecture: Architecture maps, ADR coverage, dependency direction, public-contract, and forbidden-boundary checks.
  desktop: Windows desktop shell, routing, design reference, sidecar handshake, packaging, accessibility, and interaction
    checks.
  desktop-cross-platform: macOS/Linux/Windows build, packaging, platform security, path, sidecar, project portability, and
    UI parity checks.
  service: Core API contracts and modular service behavior.
  data: Schema, migration, transaction, backup, versioning, and dependency/staleness checks.
  documents: Scholarly, technical-report, manuscript, table/figure, parser, source-anchor, and rights checks.
  search: Lexical/semantic/citation retrieval and screening checks.
  ai: Model gateway, structured output, evaluation, privacy, budget, fallback, and no-fabrication checks.
  evidence: Extraction, verification, adjudication, source-support, and evidence-state checks.
  graph: Typed scholarly/study/result/manuscript graph and projection checks.
  novelty: Nearest-prior, challenge, opportunity, and bounded novelty checks.
  study-design: Study-design alternatives, protocol completeness, methods, validity, ethics, and evidence-grounding checks.
  manuscript: Blueprint, section workflow, citation, source-grounded drafting, authorship, disclosure, and export checks.
  results: Technical-report privacy, parsing, result extraction, reconciliation, verification, and no-result-invention checks.
  reviewer: Independent reviewer roles, snapshot, comment evidence, editorial synthesis, calibration, revision, and response
    checks.
  e2e-local: Complete offline local workflows through project creation, literature analysis, study design, results, manuscript,
    review, export, restart, backup, and restore as active by gate.
  security-local: Untrusted content, local keys/storage, report/manuscript privacy, provider egress, rights, secrets, and
    denial paths.
  server: University-hosted services, identity, collaboration, licensed sources, research-production workflow, and operations.
  cloud: Tenant, residency, metering, security, research-production workload, and SaaS operations.
