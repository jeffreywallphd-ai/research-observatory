- id: CAP-15
  alias: CAP-study-design
  title: Empirical study design and protocol development
  objective: Use literature evidence, opportunity dossiers, domain knowledge, and researcher constraints to propose, compare,
    and formalize rigorous empirical study designs without displacing scholarly or ethics authority.
  exit_criteria:
  - Multiple plausible study designs are compared through explicit assumptions, evidence, validity, ethics, feasibility, and
    alternative-outcome value.
  - The selected protocol covers research logic, sampling, measurement, data collection, analysis, validity, ethics, data
    management, and reproducibility.
  - Every consequential recommendation is source-linked or clearly labeled as inference, convention, researcher preference,
    or unresolved decision.
  - The platform never implies IRB/ethics approval, preregistration, or methodological validity without human/institutional
    review.
