  alias: CAP-delivery-foundation
  title: Delivery foundation and Codex execution system
  objective: Create a reproducible repository, architecture and approved-experience guardrails, validation system, and machine-readable
    backlog that make small AI-authored changes safe and reviewable.
  exit_criteria:
  - A fresh clone can bootstrap, lint, type-check, test, and build skeleton artifacts through documented commands.
  - Codex can identify READY work, claim it, attach evidence, and advance status without corrupting dependencies.
