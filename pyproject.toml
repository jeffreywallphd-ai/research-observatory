[project]
name = "research-observatory"
version = "0.0.0"
description = "Evidence-first, local-first scholarly reasoning and research production"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["PyYAML==6.0.3"]

[dependency-groups]
dev = [
  "mypy==2.3.0",
  "ruff==0.15.22",
  "types-PyYAML==6.0.12.20260518",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/foundation/test_repository_structure.py" = ["RUF001"]
"tools/plan_review_site.py" = ["E501"]
"tools/planctl.py" = ["E501"]
"tools/slice_plan_check.py" = ["RUF001"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
