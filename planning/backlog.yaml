- id: CAP-03
  alias: CAP-research-domain-workflows
  title: Canonical domain, research intent, provenance, and durable workflows
  objective: Define canonical research objects, a versioned research-intent and primary-use-case contract, provenance, adaptive
    objective-specific workflows, durable jobs, human gates, and controlled recalculation.
  exit_criteria:
  - Core aggregates and APIs have stable identifiers, explicit versioning, and tested state machines.
  - Every consequential transformation records inputs, policy, software/model/schema versions, output, and human disposition.
  - Long-running work is resumable, cancellable, resource-governed, and capable of marking downstream outputs stale.
  - Each project has a versioned primary use case that produces an ordered, visible workflow and next-step guidance while
    preserving access to all tools and prior workflow history.
