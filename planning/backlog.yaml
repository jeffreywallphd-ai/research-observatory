architecture_constraints:
- The Tauri desktop application is the canonical user interface for local, university-hosted, and cloud-hosted deployments.
  Windows is implemented and released first; the same codebase is qualified on Apple Silicon macOS and Linux x86_64/ARM64
  in W6.
- The local desktop edition must be complete, account-optional, offline-capable, and installable without Docker, Kubernetes,
  or a separately administered database on every qualified desktop platform.
- The desktop is Tauri 2 with React and TypeScript; local analytical services are Python/FastAPI sidecars with explicit version
  handshakes and platform-specific packaging only at the outer boundary.
- Local canonical state uses SQLite in WAL mode and an encrypted, content-addressed local object store; FTS5 is the first
  lexical index.
- Durable evidence, provenance, ontologies, decisions, study designs, technical-report results, manuscripts, reviewer reports,
  and workflow state must outlive any model, prompt, vector engine, or commercial provider.
- Model access is provider-neutral. Local inference is supported through hardware-aware adapters; remote providers are explicit,
  policy-controlled, and never required for basic local use.
- Every consequential analytical or authored object must retain source, transformation, model/schema/template version, confidence,
  human decision, and stale-dependency lineage.
- Opportunity generation and novelty challenge are separate roles and workflows; neither may silently certify universal novelty.
- Study-design recommendations present alternatives, assumptions, evidence, feasibility, validity, ethics, and residual uncertainty;
  the platform does not represent generated designs as approved protocols or institutional ethics approval.
- Empirical manuscript text may use only verified literature evidence, verified technical-report/result evidence, explicit
  researcher-authored statements, or visibly marked unresolved placeholders. The system must never invent methods, sample
  sizes, analyses, results, tables, figures, or citations.
- Critical and theory drafting preserves competing interpretations, conceptual plurality, author voice, and non-propositional
  forms where appropriate rather than imposing a positivist article structure.
- Reviewer simulation uses independent role-bounded contexts, records evidence and uncertainty, avoids impersonating named
  real reviewers, and never represents simulated editorial outcomes as acceptance probabilities or actual peer review.
- Rights, confidentiality, and entitlement metadata are enforced at acquisition, model egress, collaboration, manuscript drafting,
  report use, export, synchronization, and deletion boundaries.
- University and cloud services implement the same versioned domain contracts rather than creating a separate product architecture.
- During W0-W5, create only the Windows local desktop, core, worker, contracts, tests, documentation, task control, and Windows
  packaging structure. W6 adds macOS/Linux packaging and platform adapters; hosted infrastructure remains absent until W10.
- The local vector backend remains behind a replaceable port. Select the production adapter through cross-platform reliability,
  recovery, filtering, portability, and performance benchmarks plus ADR.
- Native scholarly and technical-report formats are preferred. Docling is the baseline local document parser; manuscript and
  report parsers preserve source locations, tables, figures, revisions, and rights metadata.
- The approved UI reference under design/ui-reference is normative for user-facing routes, workflow profiles, required regions,
  tokens, semantic states, accessibility behavior, authoring/review interactions, and light/dark parity; mock content and
  values remain illustrative.
- Every project selects one versioned primary scholarly use case from the approved workflow catalog. That profile orders navigation,
  defaults, checkpoints, next-step guidance, and expected outputs while the complete tool inventory remains accessible.
- 'Intentional user-facing changes follow design first: update the style guide, workflow/page contracts, and HTML reference;
  validate them; obtain human approval; only then implement application code.'
selection_policy:
- Treat the YAML backlog as the authoritative execution ledger; DOCX and Markdown are generated views.
- The wave is the approval, durable execution, integration, qualification, and handoff unit. Every wave has one sequential
  exit/next-wave activation gate.
- Use descriptive capability aliases and slice labels in human-facing output. Preserve numeric capability IDs as immutable
  dependency/evidence keys and numeric slice IDs as immutable sequence/evidence keys.
- Within the active Wave, a slice is an ordered integration/review checkpoint and a task is the atomic implementation/evidence
  unit. Select across capability contributions only when dependencies and approved Wave order permit it.
- Start the next slice only after every required task in the current slice is DONE, slice-level end-to-end evidence is attached,
  and the slice review is approved.
- Record risk-cluster integration checkpoints as interfaces, migrations, security boundaries, or coherent groups of slices
  close. These checkpoints run the accumulated affected-profile suite but do not create new human approval gates.
- Close a Wave only after all of its slices are independently approved, the complete Wave-exit suite passes, criterion-linked
  evidence is attached, and an independent Wave review approves the integrated result. Capabilities remain cross-Wave product
  maps.
- A Wave campaign may pause for an external dependency, explicit human/ADR/design gate, unavailable platform, or an in-boundary
  blocker. Resume the same Wave campaign after ordinary process or session interruption.
- Select only tasks whose dependencies are DONE and whose wave activation gate is approved. A future slice and its later gate
  never replace the current global wave/gate in selection output.
- Filter by deployment profile and platform target. W0-W5 form the Windows baseline; W6 qualifies macOS/Linux; W7-W8 add research
  production; W9 and W10 are parallel advanced-intelligence and university tracks after G8; W11 remains cloud-only after G10.
- Claim atomically with taskctl before edits. Wave and task leases record owner, branch/worktree, base SHA, and expiration.
- Implement the complete selected task and the slice integration needed to satisfy its acceptance criteria. Record newly discovered
  work as backlog tasks rather than hidden TODOs.
- Remain IN_PROGRESS while running verification. Attach criterion-to-evidence records tied to the exact commit, then submit
  to REVIEW only when required checks pass.
- A separate reviewer or review agent approves REVIEW to DONE. Changes requested return the task to IN_PROGRESS or BLOCKED
  with a reason.
- Never renumber existing IDs. New work receives the next task ID in the appropriate slice or a new slice/capability ID.
- For intentional user-facing behavior, an approved UI-reference revision must exist before application implementation. Reference-change
  tasks precede application-change tasks.
definition_of_ready:
- The containing Wave campaign has one immutable approval covering every contributing capability decision and slice plan,
  and all predecessor work required by the task is complete or gated.
- Status is READY and all dependency task IDs are DONE.
- The task wave has no activation gate or its activation gate is approved.
- The objective, deliverable, acceptance criteria, verification profiles, platform targets, and review gate are understandable
  without hidden context.
- Required architecture, experience, template, or scholarly-method decisions exist or the task explicitly creates them.
- Required credentials, fixtures, models, reports, and platforms are available or intentionally stubbed.
- No unresolved blocker or active conflicting lease is recorded.
- For intentional user-facing change, the proposed style-guide/workflow/page-reference revision is validated and approved,
  and its reference ID is recorded on the task.
definition_of_done:
- Deliverables and all task acceptance criteria are satisfied.
- Verification commands pass on the reviewed commit and criterion-to-evidence records are attached.
- Security, privacy, rights, accessibility, scholarly-method, platform, migration, or release gates are completed when specified.
- Documentation, tests, migrations, fixtures, provenance, and stale-dependency behavior are updated as relevant.
- An independent reviewer sets review.result to approved and status to DONE.
- Newly discovered work is recorded as explicit backlog tasks rather than hidden TODOs.
- The task lease is released and branch/worktree disposition is recorded.
- User-facing implementation conforms to the approved reference ID through token, route/page-contract, workflow-navigation,
  accessibility, and visual-regression evidence.
- Task completion does not by itself complete the slice, increment, or capability; their applicable end-to-end reviews must
  also pass.
